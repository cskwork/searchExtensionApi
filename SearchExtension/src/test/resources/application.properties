#=====================================================
# 테스트 전용 설정 (src/main/resources/application.properties 를 클래스패스에서 가립니다)
# - 실제 API 키를 읽지 않음 : 모든 키는 비밀이 아닌 자리표시자 값
# - 외부 검색 API 로 나가지 않음 : base-url 은 닫힌 로컬 포트
# - 홈 디렉터리에 H2 파일을 만들지 않음 : 인메모리 DB
#=====================================================
spring.datasource.url=jdbc:h2:mem:searchextension-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.root=WARN

# KAKAO SEARCH API (테스트 자리표시자)
kakao.api.base-url=http://127.0.0.1:9
kakao.api.blog-search-path=/v2/search/blog
kakao.api.key=test-placeholder-not-a-secret

# NAVER SEARCH API (테스트 자리표시자)
naver.api.base-url=http://127.0.0.1:9
naver.api.blog-search-path=/v1/search/blog
naver.api.client-id=test-placeholder-client-id
naver.api.client-secret=test-placeholder-not-a-secret
