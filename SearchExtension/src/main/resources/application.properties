# Safe native defaults: loopback only, isolated in-memory data, no external provider credentials.
server.address=${SEARCH_BIND_ADDRESS:127.0.0.1}
server.port=${SEARCH_PORT:8080}
spring.datasource.url=${SEARCH_DB_URL:jdbc:h2:mem:search-local;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SEARCH_DB_USER:sa}
spring.datasource.password=${SEARCH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SEARCH_DDL_MODE:create-drop}
spring.h2.console.enabled=false
spring.jpa.show-sql=false
logging.level.root=INFO
search.provider-timeout-ms=${SEARCH_PROVIDER_TIMEOUT_MS:3000}
kakao.api.base-url=${KAKAO_BASE_URL:http://127.0.0.1:9}
kakao.api.blog-search-path=/v2/search/blog
kakao.api.key=${KAKAO_API_KEY:unconfigured}
naver.api.base-url=${NAVER_BASE_URL:http://127.0.0.1:9}
naver.api.blog-search-path=/v1/search/blog
naver.api.client-id=${NAVER_CLIENT_ID:unconfigured}
naver.api.client-secret=${NAVER_CLIENT_SECRET:unconfigured}
